name: 법령 수집

# 하루 1회. 06:00 KST = 21:00 UTC (전날). congress 는 04:00 KST 라 겹치지 않는다.
# ⚠️ 법제처의 일일 갱신 시각을 모른다(§06 U9). `검증.py` 가 "어제 것이 아직 없다"를
#    감지하면 조정한다.
on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "자료당 이 건수만 (비우면 전량)"
        required: false

# 기본 권한을 최소로 내린다. 이 잡들은 레포를 읽기만 하고 아무것도 쓰지 않는다 —
# 명시하지 않으면 레포/조직 기본값이 적용되고, 그 기본값은 여기가 아니라 설정 화면에서
# 바뀐다. 필요한 권한은 잡이 각자 올려 잡는다(`watchdog.yml` 이 그 예다).
permissions:
  contents: read

concurrency:
  # 예약 실행을 직렬화하되 **도는 것을 절대 선점하지 않는다.**
  # 따라잡기 설계라 앞선 실행을 죽여서 얻을 것이 없다.
  group: law-collect
  cancel-in-progress: false

jobs:
  collect:
    # 감시 대상이자 DB 가 있는 곳이 이 맥이다. DB 는 GitHub 을 거치지 않는다.
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      # ⚠️ **DB 를 체크아웃 안에 두지 마라.** `actions/checkout` 은 기본으로
      #    `git clean -ffdx` 를 도는데 `-x` 가 **gitignore 된 파일까지 지운다.**
      #    작업공간에 DB 를 두면 매 실행 첫 스텝이 두 시간 반짜리 수집물을 통째로
      #    날리고 **에러는 나지 않는다.** 체크아웃은 코드 운반체일 뿐이다.
      LAW_DB: /Users/seongjin/Coding/Skills for K-Politics/.claude/skills/k-politics/DBs/원천/법령.db
      CONGRESS_DB: /Users/seongjin/Coding/Skills for K-Politics/.claude/skills/k-politics/DBs/원천/국회.db
      # 아래는 원본의 시크릿 격리 가드다. 이 레포는 커밋된 공개 기본키를 사용한다.
      # ⚠️ **이건 선택이다.** 법제처의 OC 는 무료·공개 값이라 `원천.기본OC` 에 커밋돼 있고,
      #    시크릿이 없으면 빈 문자열이 되어 그 기본값으로 떨어진다. 다른 계정으로 갈아탈
      #    때만 등록하면 된다.
      #    ⚠️ `.env` 에만 두는 방식은 **여기서 동작하지 않는다** — 러너는 자기 `_work`
      #    아래 새 체크아웃에서 도는데 `.env` 는 gitignore 라 거기 안 딸려 온다.
      #    ⚠️ **키 자체는 잡 레벨에 두지 않는다.** 잡 레벨 `env` 는 **모든 스텝**에 들어가
      #    `upload-artifact` 같은 서드파티 액션의 프로세스 환경에도 그대로 실린다.
      #    원천을 두드리는 두 스텝에서만 준다.

    steps:
      # ⚠️ **commit SHA 로 고정한다.** `@v4` 는 이동 가능한 태그라 같은 이름이
      #    다른 코드를 가리키게 바뀔 수 있고, 이 잡은 self-hosted 라 그 코드가
      #    **내 맥에서** 돈다. 올릴 때는 SHA 를 손으로 바꾼다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 원본이 우리가 아는 그 파일인가
        id: preflight
        # ⚠️ **수집보다 먼저 선다.** 폴더를 옮긴 날 자동 수집은 새 빈 DB 를 만들고 계속
        #    초록이며, 의원실이 보는 DB 는 조용히 낡는다 — 아무 에러도 나지 않는다.
        #    법령.db 는 수 시간짜리 전량 수집의 결과물이라 대가가 특히 크다.
        run: |
          set -o pipefail
          caffeinate -ims uv run .claude/skills/k-politics/Scripts/backup.py law --점검 2>&1 | tee preflight.txt

      - name: 법제처가 바뀌었나
        id: verify
        # 무료·공개 인증키는 코드의 기본값을 쓴다. gitignore된 .env는 러너 체크아웃에 없으므로 시크릿 env를 주입하지 않는다.
        run: |
          # ⚠️ **`caffeinate` 를 빼지 마라.** 러너가 도는 맥은 유휴 절전이 켜져 있어
          #    잡이 뜬 뒤에 잠들고, 그러면 "runner lost communication" 으로 죽는다.
          #    명령이 끝나면 assertion 이 풀리므로 시스템 설정은 그대로다.
          #    `-d`·`-u` 는 새벽에 화면을 켜므로 뺀다.
          set +e
          caffeinate -ims uv run .claude/skills/k-politics/Scripts/law/verify.py > verify.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -40 verify.txt

      - name: 수집
        id: collect
        # ⚠️ **검증이 빨가면 수집하지 않는다.** 원천의 봉투나 필드가 바뀐 채로 수집하면
        #    새 형식을 그대로 적재하고, 감사가 그걸 못 잡으면 **작업 전체가 초록으로 끝난다.**
        #    계획서가 "verify 가 빨간데 코드를 고치면 틀린 값이 조용히 쌓인다"고 한 것과
        #    같은 이유로, 자동 실행에서는 아예 멈추는 쪽이 맞다.
        if: steps.verify.outputs.code == '0'
        # 무료·공개 인증키는 코드의 기본값을 쓴다. gitignore된 .env는 러너 체크아웃에 없으므로 시크릿 env를 주입하지 않는다.
        run: |
          # ⚠️ **set +e 가 맞다.** 종료코드가 판정 신호이므로(1=게이트 위반, 2=중단, 3=락 물러남)
          #    셸이 먼저 죽으면 그 신호가 사라진다. pipefail 로 tee 너머까지 전파한다.
          # ⚠️ **파일로만 받지 마라.** 이 수집은 21분을 도는데 리다이렉트만 하면 그동안
          #    화면이 통째로 빈다 — 도는지 죽었는지 알 수 없고, 러너가 죽으면
          #    `upload-artifact` 가 403 으로 실패해 파일 로그마저 사라진다.
          set +e
          set -o pipefail
          PYTHONUNBUFFERED=1 caffeinate -ims \
            uv run .claude/skills/k-politics/Scripts/law/collect.py \
            --결과 result.json \
            ${{ inputs.sample && format('--표본 {0}', inputs.sample) || '' }} \
            2>&1 | tee collect.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 스냅샷 재빌드
        id: snapshot
        # 원천이 바뀌었으니 조회용 스냅샷도 새로 만든다. 수집이 실패해 이 스텝을 건너뛰어도
        # 직전 스냅샷이 그대로 남는다 — 빌더가 검증을 통과한 뒤에만 파일을 교체한다.
        if: steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1'
        run: |
          set +e
          set -o pipefail
          caffeinate -ims uv run .claude/skills/k-politics/Scripts/snapshot.py \
            --원천국회 "$CONGRESS_DB" --원천법령 "$LAW_DB" \
            --소관기관 .claude/skills/k-politics/DBs/소관기관.db \
            --출력 .claude/skills/k-politics/DBs/법.db 2>&1 | tee snapshot.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 요약
        if: always()
        # ⚠️ **`uv run` 으로 부르지 마라.** 이 레포의 워크플로에서 `uv run` 줄은 전부
        #    `caffeinate` 아래 있어야 한다는 검사가 있고(자다 죽은 러너 실측 3회),
        #    이 스텝은 몇 밀리초짜리라 잠을 막을 이유가 없다. 렌더러는 표준 라이브러리만
        #    쓰므로 `python3` 로 충분하고, uv 가 없거나 네트워크가 끊긴 날에도 요약은 난다.
        # ⚠️ **렌더러는 절대 0 아닌 것으로 끝나지 않는다.** 요약이 빨개지면 진짜 판정
        #    옆에 두 번째 빨간불이 생긴다. 최종 판정은 아래 「판정 전파」가 낸다.
        run: |
          python3 .github/scripts/요약.py \
            --제목 "법령 수집" \
            --결과 result.json \
            --preflight "${{ steps.preflight.outcome }}" \
            --verify "${{ steps.verify.outputs.code }}" \
            --preflight-로그 preflight.txt \
            --verify-로그 verify.txt \
            --로그 collect.txt \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: law-collect-${{ github.run_number }}
          path: |
            preflight.txt
            collect.txt
            verify.txt
            result.json
            snapshot.txt
          retention-days: 30

      - name: 판정 전파
        if: always()
        # ⚠️ **판정 결과를 파이프로 넘기지 마라.** `수집.py | tee` 는 셸이 마지막 명령의
        #    종료코드를 돌려주므로 게이트 위반의 1 이 tee 의 0 으로 덮인다.
        # ⚠️ **검증 실패도 전파해야 한다.** 수집 종료코드만 보면, 검증이 빨개서 수집을
        #    건너뛴 실행이 **초록으로 끝난다** — 원천이 바뀐 날 아무도 모르게 된다.
        run: |
          p=${{ steps.preflight.outcome }}
          v=${{ steps.verify.outputs.code }}
          c=${{ steps.collect.outputs.code || 1 }}
          s=${{ steps.snapshot.outputs.code || 1 }}
          [ "$p" != "success" ] && { echo "::error::DB 경로 점검 실패 — 수집을 시작하지 않았다"; exit 1; }
          [ "$v" != "0" ] && { echo "::error::검증 실패($v) — 수집을 건너뛰었다"; exit 1; }
          # ⚠️ **3(락을 못 잡아 물러남)은 고장이 아니다 — 빨갛게 만들면 늑대를 부른다.**
          #    다만 **0 과 같은 얼굴이어서도 안 된다**: 그날 원천에서 받은 것이 없다.
          #    `collect-congress.yml` 과 같은 규칙이다.
          [ "$c" = "3" ] && { echo "::warning::이미 도는 실행이 있어 물러났다 — 오늘 받은 것이 없다"; exit 0; }
          # 스냅샷 실패는 낡은 조회 결과를 숨기므로 전파한다. 락 물러남만 경고이며 수집 실패를 덮지 않는다.
          if [ "$c" = "0" ] || [ "$c" = "1" ]; then
            case "$s" in
              0) ;;
              3) echo "::warning::스냅샷 락을 못 잡아 물러났다 — 직전 스냅샷을 유지한다" ;;
              *) echo "::error::스냅샷 재빌드 실패($s) — 조회용 스냅샷이 갱신되지 않았다"; exit 1 ;;
            esac
          fi
          exit "$c"
